
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="image/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">

  <meta name="theme-color" content="#f7f5ff">

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

  <!-- Lottie 애니메이션 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

  <title>버스 탈 수 있을까?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      background: #f7f5ff;
      color: #33314a;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
    }

    .top {
      padding: 20px 6px 24px;
    }

    .eyebrow {
      display: inline-block;
      padding: 7px 11px;
      margin-bottom: 14px;
      border-radius: 20px;
      background: #e9e3ff;
      color: #7765bd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.35;
      letter-spacing: -1.2px;
      font-weight: 800;
    }

    /* 메인 타이틀 + 날씨 */
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .title-row h1 {
      flex-shrink: 0;
    }

    .weather-widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 90px;
      margin-right: 5px;
    }

    #weatherAnimation {
      width: 76px;
      height: 76px;
    }

    #weatherAnimation svg {
      width: 100%;
      height: 100%;
    }

    #weatherTemp {
      margin-top: -5px;
      color: #77738f;
      font-size: 14px;
      font-weight: 700;
    }

    .subtitle {
      margin: 10px 0 18px;
      color: #89869f;
      font-size: 14px;
      line-height: 1.6;
    }

    /* 현재 버스 정보 */
    .bus-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      margin-top: 18px;
      background: #ffffff;
      border: 1px solid #eeebf8;
      border-radius: 16px;
    }

    .bus-info-text {
      min-width: 0;
    }

    .bus-info-label {
      display: block;
      margin-bottom: 5px;
      color: #89859f;
      font-size: 11px;
      font-weight: 700;
    }

    .bus-info-name {
      color: #393650;
      font-size: 15px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .bus-info-number {
      margin-left: 5px;
      color: #8575d5;
    }

    .switch-button {
      flex-shrink: 0;
      padding: 9px 11px;
      border: 1px solid #e5e0f6;
      border-radius: 11px;
      background: #f5f2ff;
      color: #7869b8;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .switch-button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .card {
      padding: 24px;
      margin-bottom: 16px;
      background: #ffffff;
      border: 1px solid #eeebf8;
      border-radius: 26px;
      box-shadow: 0 8px 30px rgba(77, 65, 130, 0.05);
    }

    .section-label {
      display: block;
      margin-bottom: 14px;
      color: #77738f;
      font-size: 13px;
      font-weight: 700;
    }

    .select-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    select {
      width: 100%;
      height: 54px;
      padding: 0 42px 0 16px;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid #e9e6f3;
      border-radius: 15px;
      outline: none;
      background: #faf9ff;
      color: #393650;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
    }

    .select-wrap::after {
      content: "⌄";
      position: absolute;
      right: 17px;
      top: 12px;
      color: #8d82c5;
      font-size: 22px;
      pointer-events: none;
    }

    /* 버스 도착 정보 */
    .arrival-card {
      position: relative;
      overflow: hidden;
      padding: 25px 24px;
      background: #e9e4ff;
      border: none;
    }

    .arrival-card::after {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      right: -48px;
      top: -48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
    }

    .arrival-heading {
      position: relative;
      z-index: 1;
      color: #7468a8;
      font-size: 13px;
      font-weight: 700;
    }

    .arrival-number {
      position: relative;
      z-index: 1;
      margin: 16px 0 8px;
      color: #51457f;
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.1;
    }

    .arrival-number small {
      margin-left: 5px;
      font-size: 19px;
      letter-spacing: 0;
    }

    .arrival-caption {
      position: relative;
      z-index: 1;
      color: #8075ae;
      font-size: 12px;
    }

    /* 혼잡도 */
    .congestion {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 16px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.65);
      color: #7468a8;
      font-size: 12px;
      font-weight: 700;
    }

    .congestion-value {
      color: #51457f;
      font-size: 13px;
    }

    /* 다음 버스 */
    .next-bus {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(116, 104, 168, 0.18);
      color: #8075ae;
      font-size: 12px;
    }

    .next-bus strong {
      margin-left: 4px;
      color: #51457f;
      font-size: 13px;
    }

    .result-card {
      padding: 21px;
    }

    .result-label {
      margin-bottom: 12px;
      color: #89859f;
      font-size: 12px;
      font-weight: 700;
    }

    .result-message {
      margin: 0;
      color: #393650;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.5;
      letter-spacing: -0.5px;
      overflow-wrap: anywhere;
    }

    .result-detail {
      margin: 8px 0 0;
      color: #89869f;
      font-size: 13px;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      margin-bottom: 12px;
      border-radius: 9px;
      background: #f0edf9;
      color: #7b70a7;
      font-size: 11px;
      font-weight: 700;
    }

    .status.good {
      background: #e2f5e9;
      color: #36845a;
    }

    .status.soon {
      background: #fff0d9;
      color: #a36c21;
    }

    .status.miss {
      background: #ffe7e9;
      color: #c45e6c;
    }

    .status.error {
      background: #ffe7e9;
      color: #c45e6c;
    }

    .main-button {
      width: 100%;
      min-height: 56px;
      margin-top: 4px;
      border: none;
      border-radius: 17px;
      background: #8575d5;
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(133, 117, 213, 0.23);
      transition: transform 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .main-button:active {
      transform: scale(0.98);
      background: #7161c3;
    }

    .main-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .footer {
      padding: 12px 4px;
      text-align: center;
      color: #a19db5;
      font-size: 11px;
      line-height: 1.8;
    }

    @media (max-width: 360px) {
      body {
        padding: 20px 14px;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 27px;
      }

      .bus-info {
        padding: 12px;
      }

      .switch-button {
        padding: 8px;
        font-size: 11px;
      }

      .weather-widget {
        width: 76px;
      }

      #weatherAnimation {
        width: 66px;
        height: 66px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="top">
      <span class="eyebrow">MY DAILY BUS</span>

      <!-- 메인 타이틀 + 날씨 -->
      <div class="title-row">
        <h1>버스 탈 수<br>있을까요?</h1>

        <div class="weather-widget">
          <div id="weatherAnimation"></div>
          <span id="weatherTemp">--°</span>
        </div>
      </div>

      <p class="subtitle">
        도착 시간과 걸리는 시간을 비교해 여유 있게 출발해 보세요.
      </p>

      <!-- 현재 정류소 및 버스 정보 -->
      <div class="bus-info">
        <div class="bus-info-text">
          <span class="bus-info-label">CURRENT BUS</span>
          <div class="bus-info-name">
            <span id="stopName">정류소 확인 전</span>
            <span class="bus-info-number" id="busNumber"></span>
          </div>
        </div>

        <button class="switch-button" id="switchBusButton">
          다른 버스 조회하기
        </button>
      </div>
    </header>

    <!-- 도보 시간 선택 -->
    <section class="card">
      <label class="section-label" for="walkTime">
        정류장까지 얼마나 걸리나요?
      </label>

      <div class="select-wrap">
        <select id="walkTime">
          <option value="1">1분 · 바로 앞이에요</option>
          <option value="3">3분 · 가까워요</option>
          <option value="5" selected>5분 · 보통이에요</option>
          <option value="7">7분 · 조금 걸어요</option>
          <option value="10">10분 · 여유가 필요해요</option>
        </select>
      </div>

      <button class="main-button" id="checkButton">
        버스 도착 정보 확인하기
      </button>
    </section>

    <!-- 버스 도착 정보 -->
    <section class="card arrival-card">
      <div class="arrival-heading">
        BUS ARRIVAL · 버스 도착 예정
      </div>

      <div class="arrival-number">
        <span id="arrivalTime">--</span><small>분 후</small>
      </div>

      <div class="arrival-caption" id="arrivalCaption">
        확인 버튼을 눌러 실시간 정보를 조회하세요.
      </div>

      <!-- 혼잡도 -->
      <div class="congestion">
        혼잡도
        <span class="congestion-value" id="congestion">
          확인 전
        </span>
      </div>
    </section>

    <!-- 탑승 가능 여부 -->
    <section class="card result-card">
      <div class="result-label">MY BUS CHECK</div>

      <span class="status" id="status">출발 준비</span>

      <h2 class="result-message" id="result">
        버스를 탈 수 있을지 확인해 보세요.
      </h2>

      <p class="result-detail" id="resultDetail">
        도착 시간과 도보 시간을 비교해 드립니다.
      </p>

      <!-- 다음 버스 도착 예정 -->
      <div class="next-bus">
        다음 버스 도착 예정
        <strong id="nextBusTime">--분 후</strong>
      </div>
    </section>

    <footer class="footer">
      버스 도착 예정 시간은 실시간 교통 상황에 따라<br>
      달라질 수 있습니다.
    </footer>

  </main>

  <script>
    // ==========================================
    // API 설정
    // ==========================================

    const API_URL =
      "https://seoul-bus-api.harteh31.workers.dev/api/bus";


    // ==========================================
    // 날씨 API 설정
    // ==========================================

    const WEATHER_API =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=37.5915831099" +
      "&longitude=127.0527127306" +
      "&timezone=Asia%2FSeoul" +
      "&current=weather_code,temperature_2m,is_day";


    // 날씨 애니메이션 URL
    const weatherAnimations = {
      clear:
        "https://cdn.meteocons.com/3.0.0-next.10/lottie/fill/clear-day.json",

      overcast:
        "https://cdn.meteocons.com/3.0.0-next.10/lottie/fill/overcast.json",

      partly:
        "https://cdn.meteocons.com/3.0.0-next.10/lottie/fill/partly-cloudy-day.json",

      rain:
        "https://cdn.meteocons.com/3.0.0-next.10/lottie/fill/drizzle.json",

      snow:
        "https://cdn.meteocons.com/3.0.0-next.10/lottie/fill/overcast-snow.json",

      thunder:
        "https://cdn.meteocons.com/3.0.0-next.10/lottie/fill/extreme-thunderstorms.json"
    };


    // 현재 재생 중인 애니메이션
    let weatherAnimationInstance = null;


    // ==========================================
    // 날씨 코드에 따른 애니메이션 선택
    // ==========================================

    function getWeatherAnimation(code) {

      // 맑음
      if (code === 0 || code === 1) {
        return weatherAnimations.clear;
      }

      // 조금 흐림
      if (code === 2) {
        return weatherAnimations.partly;
      }

      // 흐림 및 안개
      if (code === 3 || code === 45 || code === 48) {
        return weatherAnimations.overcast;
      }

      // 비와 이슬비
      if (
        (code >= 51 && code <= 67) ||
        (code >= 80 && code <= 82)
      ) {
        return weatherAnimations.rain;
      }

      // 눈
      if (
        (code >= 71 && code <= 77) ||
        code === 85 ||
        code === 86
      ) {
        return weatherAnimations.snow;
      }

      // 뇌우
      if (code >= 95 && code <= 99) {
        return weatherAnimations.thunder;
      }

      // 기타 날씨
      return weatherAnimations.overcast;
    }


    // ==========================================
    // 날씨 애니메이션 실행
    // ==========================================

    function playWeatherAnimation(animationUrl) {

      const container =
        document.getElementById("weatherAnimation");

      // 기존 애니메이션 제거
      if (weatherAnimationInstance) {
        weatherAnimationInstance.destroy();
      }

      // 새로운 애니메이션 실행
      weatherAnimationInstance = lottie.loadAnimation({
        container: container,
        renderer: "svg",
        loop: true,
        autoplay: true,
        path: animationUrl
      });
    }


    // ==========================================
    // 실시간 날씨 조회
    // ==========================================

    async function loadWeather() {

      const tempDisplay =
        document.getElementById("weatherTemp");

      try {

        const response = await fetch(WEATHER_API);

        if (!response.ok) {
          throw new Error(
            "날씨 API 요청 실패: " + response.status
          );
        }

        const data = await response.json();

        const current = data.current;

        const weatherCode = current.weather_code;
        const temperature = current.temperature_2m;

        // 현재 기온 표시
        tempDisplay.textContent =
          Math.round(temperature) + "°";

        // 날씨 코드에 맞는 애니메이션 선택
        const animationUrl =
          getWeatherAnimation(weatherCode);

        // 애니메이션 실행
        playWeatherAnimation(animationUrl);

      } catch (error) {

        console.error("날씨 정보 오류:", error);

        tempDisplay.textContent = "--°";
      }
    }


    // ==========================================
    // 버스 조회 설정
    // ==========================================

    const buses = [
      {
        stId: "105000185",
        busRouteId: "100100049",
        ord: "21"
      },
      {
        stId: "107000087",
        busRouteId: "100100049",
        ord: "81"
      }
    ];


    // 현재 선택된 버스 번호
    let selectedBusIndex = 0;


    // ==========================================
    // HTML 요소 연결
    // ==========================================

    const button =
      document.getElementById("checkButton");

    const switchButton =
      document.getElementById("switchBusButton");

    const arrivalDisplay =
      document.getElementById("arrivalTime");

    const arrivalCaption =
      document.getElementById("arrivalCaption");

    const stopNameDisplay =
      document.getElementById("stopName");

    const busNumberDisplay =
      document.getElementById("busNumber");

    const congestionDisplay =
      document.getElementById("congestion");

    const nextBusDisplay =
      document.getElementById("nextBusTime");

    const result =
      document.getElementById("result");

    const resultDetail =
      document.getElementById("resultDetail");

    const status =
      document.getElementById("status");


    // ==========================================
    // 상태 표시
    // ==========================================

    function showStatus(text, type = "") {

      status.textContent = text;

      status.className =
        "status" + (type ? " " + type : "");
    }


    // ==========================================
    // 초 단위를 분 단위로 변환
    // ==========================================

    function secondsToMinutes(value) {

      if (
        value === null ||
        value === undefined ||
        value.trim() === ""
      ) {
        return null;
      }

      const seconds = Number(value);

      if (
        !Number.isFinite(seconds) ||
        seconds < 0
      ) {
        return null;
      }

      return Math.ceil(seconds / 60);
    }


    // ==========================================
    // 혼잡도 구분
    // ==========================================

    function getCongestion(xml) {

      const division =
        xml.querySelector("brerde_Div1")
          ?.textContent?.trim();

      const value =
        xml.querySelector("brdrde_Num1")
          ?.textContent?.trim();

      // 혼잡도 데이터 구분값이 4인 경우에만 표시
      if (division !== "4") {
        return "데이터 없음";
      }

      const congestionMap = {
        "0": "데이터 없음",
        "3": "여유",
        "4": "보통",
        "5": "혼잡"
      };

      return congestionMap[value] || "데이터 없음";
    }


    // ==========================================
    // 버스 도착 정보 조회
    // ==========================================

    async function getBusArrival() {

      button.disabled = true;
      switchButton.disabled = true;

      button.textContent = "도착 정보 확인 중...";

      result.textContent =
        "버스 정보를 확인하고 있습니다.";

      resultDetail.textContent =
        "잠시만 기다려 주세요.";

      showStatus("조회 중");

      try {

        const currentBus =
          buses[selectedBusIndex];

        // Cloudflare 서버에 필요한 값 전달
        const params = new URLSearchParams({
          stId: currentBus.stId,
          busRouteId: currentBus.busRouteId,
          ord: currentBus.ord
        });

        const response = await fetch(
          `${API_URL}?${params}`
        );

        if (!response.ok) {
          throw new Error(
            "API 요청 실패: " + response.status
          );
        }

        const xmlText = await response.text();

        const xml = new DOMParser().parseFromString(
          xmlText,
          "application/xml"
        );

        if (xml.querySelector("parsererror")) {
          throw new Error(
            "XML 응답을 읽을 수 없습니다."
          );
        }

        // 정류소 이름
        const stopName =
          xml.querySelector("stNm")
            ?.textContent?.trim();

        // 버스 번호
        const busNumber =
          xml.querySelector("busRouteAbrv")
            ?.textContent?.trim();

        stopNameDisplay.textContent =
          stopName || "정류소 정보 없음";

        busNumberDisplay.textContent =
          busNumber ? ` · ${busNumber}번` : "";

        // 첫 번째 버스 도착 시간
        const arrivalSeconds =
          xml.querySelector("kals1")
            ?.textContent?.trim();

        const arrivalMinutes =
          secondsToMinutes(arrivalSeconds);

        if (arrivalMinutes === null) {
          throw new Error(
            "유효한 도착시간이 없습니다."
          );
        }

        arrivalDisplay.textContent =
          arrivalMinutes;

        arrivalCaption.textContent =
          "버스 도착까지 약 " +
          arrivalMinutes +
          "분 남았습니다.";

        // 혼잡도
        congestionDisplay.textContent =
          getCongestion(xml);

        // 두 번째 버스 도착 시간
        const nextArrivalSeconds =
          xml.querySelector("kals2")
            ?.textContent?.trim();

        const nextArrivalMinutes =
          secondsToMinutes(nextArrivalSeconds);

        nextBusDisplay.textContent =
          nextArrivalMinutes !== null
            ? nextArrivalMinutes + "분 후"
            : "정보 없음";

        // 도보 시간과 도착 시간 비교
        const walk = Number(
          document.getElementById("walkTime").value
        );

        const spare = arrivalMinutes - walk;

        if (spare >= 3) {

          showStatus("탑승 여유", "good");

          result.textContent =
            "천천히 이동하셔도 괜찮아요.";

          resultDetail.textContent =
            "약 " + spare + "분의 여유 시간이 있습니다.";

        } else if (spare > 0) {

          showStatus("서둘러 이동", "soon");

          result.textContent =
            "조금 서둘러 주세요!";

          resultDetail.textContent =
            "여유 시간이 약 " + spare + "분뿐입니다.";

        } else {

          showStatus("시간이 촉박해요", "miss");

          result.textContent =
            "다음 버스도 확인해 보세요.";

          resultDetail.textContent =
            "현재 도보 시간으로는 버스를 놓칠 수 있습니다.";
        }

      } catch (error) {

        console.error(
          "버스 도착정보 오류:",
          error
        );

        showStatus("조회 실패", "error");

        result.textContent =
          "도착 정보를 가져오지 못했어요.";

        resultDetail.textContent =
          "네트워크와 API 응답을 확인해 주세요.";

        arrivalCaption.textContent =
          "도착 시간을 확인할 수 없습니다.";

        arrivalDisplay.textContent = "--";

        congestionDisplay.textContent =
          "정보 없음";

        nextBusDisplay.textContent =
          "정보 없음";

      } finally {

        button.disabled = false;
        switchButton.disabled = false;

        button.textContent =
          "버스 도착 정보 다시 확인";
      }
    }


    // ==========================================
    // 다른 버스로 전환
    // ==========================================

    switchButton.addEventListener("click", () => {

      selectedBusIndex =
        selectedBusIndex === 0 ? 1 : 0;

      // 이전 버스 정보 초기화
      stopNameDisplay.textContent =
        "조회 중...";

      busNumberDisplay.textContent = "";

      arrivalDisplay.textContent = "--";

      arrivalCaption.textContent =
        "새로운 버스 정보를 확인하고 있습니다.";

      congestionDisplay.textContent =
        "확인 중";

      nextBusDisplay.textContent =
        "확인 중";

      getBusArrival();
    });


    // ==========================================
    // 도착 정보 확인 버튼
    // ==========================================

    button.addEventListener(
      "click",
      getBusArrival
    );


    // ==========================================
    // 페이지 접속 시 자동 실행
    // ==========================================

    // 실시간 날씨 조회
    loadWeather();

  </script>
</body>
</html>
