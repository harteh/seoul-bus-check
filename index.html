
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ff">
  <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <title>버스 탈 수 있을까?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      background: #f7f5ff;
      color: #33314a;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
    }

    .top {
      padding: 20px 6px 24px;
    }

    .eyebrow {
      display: inline-block;
      padding: 7px 11px;
      margin-bottom: 14px;
      border-radius: 20px;
      background: #e9e3ff;
      color: #7765bd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.35;
      letter-spacing: -1.2px;
      font-weight: 800;
    }

    .subtitle {
      margin: 10px 0 0;
      color: #89869f;
      font-size: 14px;
      line-height: 1.6;
    }

    .card {
      padding: 24px;
      margin-bottom: 16px;
      background: #ffffff;
      border: 1px solid #eeebf8;
      border-radius: 26px;
      box-shadow: 0 8px 30px rgba(77, 65, 130, 0.05);
    }

    .section-label {
      display: block;
      margin-bottom: 14px;
      color: #77738f;
      font-size: 13px;
      font-weight: 700;
    }

    .select-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    select {
      width: 100%;
      height: 54px;
      padding: 0 42px 0 16px;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid #e9e6f3;
      border-radius: 15px;
      outline: none;
      background: #faf9ff;
      color: #393650;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
    }

    .select-wrap::after {
      content: "⌄";
      position: absolute;
      right: 17px;
      top: 12px;
      color: #8d82c5;
      font-size: 22px;
      pointer-events: none;
    }

    .arrival-card {
      position: relative;
      overflow: hidden;
      padding: 25px 24px;
      background: #e9e4ff;
      border: none;
    }

    .arrival-card::after {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      right: -48px;
      top: -48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
    }

    .arrival-heading {
      position: relative;
      z-index: 1;
      color: #7468a8;
      font-size: 13px;
      font-weight: 700;
    }

    .arrival-number {
      position: relative;
      z-index: 1;
      margin: 16px 0 8px;
      color: #51457f;
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.1;
    }

    .arrival-number small {
      margin-left: 5px;
      font-size: 19px;
      letter-spacing: 0;
    }

    .arrival-caption {
      position: relative;
      z-index: 1;
      color: #8075ae;
      font-size: 12px;
    }

    .result-card {
      padding: 21px;
    }

    .result-label {
      margin-bottom: 12px;
      color: #89859f;
      font-size: 12px;
      font-weight: 700;
    }

    .result-message {
      margin: 0;
      color: #393650;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.5;
      letter-spacing: -0.5px;
      overflow-wrap: anywhere;
    }

    .result-detail {
      margin: 8px 0 0;
      color: #89869f;
      font-size: 13px;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      margin-bottom: 12px;
      border-radius: 9px;
      background: #f0edf9;
      color: #7b70a7;
      font-size: 11px;
      font-weight: 700;
    }

    .status.good {
      background: #e2f5e9;
      color: #36845a;
    }

    .status.soon {
      background: #fff0d9;
      color: #a36c21;
    }

    .status.miss {
      background: #ffe7e9;
      color: #c45e6c;
    }

    .status.error {
      background: #ffe7e9;
      color: #c45e6c;
    }

    .main-button {
      width: 100%;
      min-height: 56px;
      margin-top: 4px;
      border: none;
      border-radius: 17px;
      background: #8575d5;
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(133, 117, 213, 0.23);
      transition: transform 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .main-button:active {
      transform: scale(0.98);
      background: #7161c3;
    }

    .main-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .footer {
      padding: 12px 4px;
      text-align: center;
      color: #a19db5;
      font-size: 11px;
      line-height: 1.8;
    }

    @media (max-width: 360px) {
      body {
        padding: 20px 14px;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="top">
      <span class="eyebrow">MY DAILY BUS</span>
      <h1>버스 탈 수<br>있을까요?</h1>
      <p class="subtitle">
        도착 시간과 걸리는 시간을 비교해<br>
        여유 있게 출발해 보세요.
      </p>
    </header>

    <section class="card">
      <label class="section-label" for="walkTime">
        정류장까지 얼마나 걸리나요?
      </label>

      <div class="select-wrap">
        <select id="walkTime">
          <option value="1">1분 · 바로 앞이에요</option>
          <option value="3">3분 · 가까워요</option>
          <option value="5" selected>5분 · 보통이에요</option>
          <option value="7">7분 · 조금 걸어요</option>
          <option value="10">10분 · 여유가 필요해요</option>
        </select>
      </div>

      <button class="main-button" id="checkButton">
        버스 도착 정보 확인하기
      </button>    
      
    </section>


    <section class="card arrival-card">
      <div class="arrival-heading">
        BUS ARRIVAL · 버스 도착 예정
      </div>

      <div class="arrival-number">
        <span id="arrivalTime">--</span><small>분 후</small>
      </div>

      <div class="arrival-caption" id="arrivalCaption">
        확인 버튼을 눌러 실시간 정보를 조회하세요.
      </div>
    </section>

    <section class="card result-card">
      <div class="result-label">MY BUS CHECK</div>
      <span class="status" id="status">출발 준비</span>
      <h2 class="result-message" id="result">
        버스를 탈 수 있을지 확인해 보세요.
      </h2>
      <p class="result-detail" id="resultDetail">
        도착 시간과 도보 시간을 비교해 드립니다.
      </p>
    </section>

    <footer class="footer">
      버스 도착 예정 시간은 실시간 교통 상황에 따라<br>
      달라질 수 있습니다.
    </footer>

  </main>


<script>
  const API_URL =
    "https://seoul-bus-api.harteh31.workers.dev/api/bus";

  // 실제 정류소ID·노선ID·정류소순번 정보로 변경하세요.
  const stId = "105000185";
  const busRouteId = "100100049";
  const ord = "21";

  const button = document.getElementById("checkButton");
  const arrivalDisplay = document.getElementById("arrivalTime");
  const arrivalCaption = document.getElementById("arrivalCaption");
  const result = document.getElementById("result");
  const resultDetail = document.getElementById("resultDetail");
  const status = document.getElementById("status");

  function showStatus(text, type = "") {
    status.textContent = text;
    status.className = "status" + (type ? " " + type : "");
  }

  async function getBusArrival() {
    button.disabled = true;
    button.textContent = "도착 정보 확인 중...";
    result.textContent = "버스 정보를 확인하고 있습니다.";
    resultDetail.textContent = "잠시만 기다려 주세요.";
    showStatus("조회 중");

    try {
      // Cloudflare 서버에 필요한 값만 전달합니다.
      const params = new URLSearchParams({
        stId,
        busRouteId,
        ord
      });

      const response = await fetch(`${API_URL}?${params}`);

      if (!response.ok) {
        throw new Error("API 요청 실패: " + response.status);
      }

      const xmlText = await response.text();
      const xml = new DOMParser().parseFromString(
        xmlText,
        "application/xml"
      );

      if (xml.querySelector("parsererror")) {
        throw new Error("XML 응답을 읽을 수 없습니다.");
      }

      // 기존에 확인한 도착 시간 필드
      const arrivalSeconds = Number(
        xml.querySelector("kals1")?.textContent
      );

      if (
        !Number.isFinite(arrivalSeconds) ||
        arrivalSeconds < 0
      ) {
        throw new Error("유효한 도착시간이 없습니다.");
      }

      const arrivalMinutes = Math.ceil(arrivalSeconds / 60);

      arrivalDisplay.textContent = arrivalMinutes;
      arrivalCaption.textContent =
        "버스 도착까지 약 " + arrivalMinutes + "분 남았습니다.";

      const walk = Number(
        document.getElementById("walkTime").value
      );

      const spare = arrivalMinutes - walk;

      if (spare >= 3) {
        showStatus("탑승 여유", "good");
        result.textContent = "천천히 이동하셔도 괜찮아요.";
        resultDetail.textContent =
          "약 " + spare + "분의 여유 시간이 있습니다.";
      } else if (spare > 0) {
        showStatus("서둘러 이동", "soon");
        result.textContent = "조금 서둘러 주세요!";
        resultDetail.textContent =
          "여유 시간이 약 " + spare + "분뿐입니다.";
      } else {
        showStatus("시간이 촉박해요", "miss");
        result.textContent = "다음 버스도 확인해 보세요.";
        resultDetail.textContent =
          "현재 도보 시간으로는 버스를 놓칠 수 있습니다.";
      }

    } catch (error) {
      console.error("버스 도착정보 오류:", error);
      showStatus("조회 실패", "error");
      result.textContent = "도착 정보를 가져오지 못했어요.";
      resultDetail.textContent =
        "네트워크와 API 응답을 확인해 주세요.";
      arrivalCaption.textContent =
        "도착 시간을 확인할 수 없습니다.";
    } finally {
      button.disabled = false;
      button.textContent = "버스 도착 정보 다시 확인";
    }
  }

  button.addEventListener("click", getBusArrival);
</script>

</body>
</html>
